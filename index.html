<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0018">
<title>GTA VI · Vice City Countdown</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
/* ============================================================
   RESET
   ============================================================ */
*, *::before, *::after {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  height: 100%;
  width: 100%;
  overflow: hidden;
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'SF Pro Display', system-ui, sans-serif;
  font-feature-settings: 'tnum' 1, 'ss01' 1, 'cv11' 1;
  background: #0a0018;
  color: #ffffff;
  display: flex;
  justify-content: center;
  align-items: center;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
  position: relative;
}

/* ============================================================
   BACKGROUND — Vice City deep atmosphere
   ============================================================ */
.bg {
  position: fixed;
  inset: 0;
  z-index: 0;
  overflow: hidden;
  background: #0a0018;
}

/* Dark overlay */
.bg::before {
  content: '';
  position: absolute;
  inset: 0;
  background:
    linear-gradient(180deg,
      rgba(10, 0, 24, 0.75) 0%,
      rgba(10, 0, 24, 0.35) 28%,
      rgba(10, 0, 24, 0.30) 48%,
      rgba(10, 0, 24, 0.60) 76%,
      rgba(10, 0, 24, 0.95) 100%);
  pointer-events: none;
  z-index: 1;
}

/* Vice City color wash */
.bg::after {
  content: '';
  position: absolute;
  inset: 0;
  background:
    radial-gradient(ellipse at 15% 8%, rgba(255, 45, 120, 0.25) 0%, transparent 55%),
    radial-gradient(ellipse at 88% 92%, rgba(34, 211, 238, 0.22) 0%, transparent 55%),
    radial-gradient(ellipse at 50% 100%, rgba(168, 85, 247, 0.20) 0%, transparent 60%);
  mix-blend-mode: screen;
  pointer-events: none;
  z-index: 2;
}

/* ============================================================
   RETRO GRID FLOOR
   ============================================================ */
.grid {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: 24%;
  overflow: hidden;
  perspective: 220px;
  perspective-origin: 50% 0%;
  z-index: 3;
  pointer-events: none;
  -webkit-mask-image: linear-gradient(180deg, transparent 0%, black 30%, black 100%);
  mask-image: linear-gradient(180deg, transparent 0%, black 30%, black 100%);
}

.grid::before {
  content: '';
  position: absolute;
  inset: -100% -100% 0 -100%;
  background-image:
    linear-gradient(rgba(255, 45, 120, 0.55) 1.5px, transparent 1.5px),
    linear-gradient(90deg, rgba(34, 211, 238, 0.55) 1.5px, transparent 1.5px);
  background-size: 60px 60px;
  transform: rotateX(72deg);
  transform-origin: 50% 0;
  animation: gridScroll 2.4s linear infinite;
  opacity: 0.85;
}

@keyframes gridScroll {
  0%   { background-position: 0 0; }
  100% { background-position: 0 60px; }
}

/* ============================================================
   SCANLINES
   ============================================================ */
.scanlines {
  position: absolute;
  inset: 0;
  z-index: 4;
  pointer-events: none;
  background: repeating-linear-gradient(
    0deg,
    rgba(0, 0, 0, 0.10) 0px,
    rgba(0, 0, 0, 0.10) 1px,
    transparent 1px,
    transparent 3px
  );
  opacity: 0.35;
}

/* ============================================================
   VIGNETTE
   ============================================================ */
.vignette {
  position: absolute;
  inset: 0;
  z-index: 5;
  pointer-events: none;
  background: radial-gradient(ellipse at 50% 50%, transparent 30%, rgba(10, 0, 24, 0.75) 95%);
}

/* ============================================================
   APP
   ============================================================ */
.app {
  position: relative;
  z-index: 10;
  width: 100%;
  height: 100vh;
  max-width: 460px;
  display: flex;
  flex-direction: column;
  padding:
    max(env(safe-area-inset-top, 30px), 30px)
    28px
    max(env(safe-area-inset-bottom, 26px), 26px);
}

.stack {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  gap: 22px;
  padding: 18px 0;
}

/* ============================================================
   HEADER
   ============================================================ */
.header {
  text-align: center;
  animation: rise 1s cubic-bezier(0.16, 1, 0.3, 1) both;
}

.brand {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 6px;
  text-transform: uppercase;
  color: rgba(255, 255, 255, 0.65);
  margin-bottom: 10px;
  text-shadow: 0 2px 12px rgba(0, 0, 0, 0.9), 0 0 12px rgba(255, 45, 120, 0.5);
}

.title {
  font-size: 62px;
  font-weight: 900;
  letter-spacing: -3px;
  line-height: 0.9;
  background: linear-gradient(180deg, #ffffff 0%, #ffd166 40%, #ff2d78 100%);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  color: transparent;
  filter:
    drop-shadow(0 2px 4px rgba(0, 0, 0, 0.95))
    drop-shadow(0 4px 30px rgba(255, 45, 120, 0.75))
    drop-shadow(0 8px 60px rgba(255, 140, 66, 0.45));
}

.subtitle {
  margin-top: 14px;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 6px;
  text-transform: uppercase;
  color: #22d3ee;
  text-shadow:
    0 2px 8px rgba(0, 0, 0, 0.95),
    0 0 14px rgba(34, 211, 238, 0.85),
    0 0 28px rgba(34, 211, 238, 0.5);
  display: inline-flex;
  align-items: center;
  gap: 12px;
}

.subtitle::before,
.subtitle::after {
  content: '';
  width: 24px;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(34, 211, 238, 0.8), transparent);
  box-shadow: 0 0 8px rgba(34, 211, 238, 0.6);
}

/* ============================================================
   MIDDLE
   ============================================================ */
.middle {
  display: flex;
  flex-direction: column;
  justify-content: center;
  flex: 1;
  gap: 26px;
}

/* ============================================================
   DAYS HERO
   ============================================================ */
.days {
  text-align: center;
  animation: rise 1s cubic-bezier(0.16, 1, 0.3, 1) 0.1s both;
  position: relative;
}

.days::before {
  content: '';
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 300px;
  height: 300px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(10, 0, 24, 0.60) 0%, transparent 65%);
  filter: blur(30px);
  z-index: -1;
  pointer-events: none;
}

.days-value {
  font-size: clamp(96px, 28vw, 140px);
  font-weight: 900;
  letter-spacing: -7px;
  line-height: 0.85;
  font-variant-numeric: tabular-nums;
  background: linear-gradient(180deg, #ffffff 0%, #ffd166 45%, #ff2d78 100%);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  color: transparent;
  filter:
    drop-shadow(0 3px 6px rgba(0, 0, 0, 0.98))
    drop-shadow(0 0 25px rgba(255, 45, 120, 0.85))
    drop-shadow(0 0 50px rgba(255, 140, 66, 0.55));
}

.days-label {
  margin-top: 14px;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 7px;
  text-transform: uppercase;
  color: rgba(255, 255, 255, 0.9);
  text-shadow:
    0 2px 8px rgba(0, 0, 0, 0.95),
    0 0 12px rgba(34, 211, 238, 0.65);
}

/* ============================================================
   UNITS
   ============================================================ */
.units {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
  text-align: center;
  animation: rise 1s cubic-bezier(0.16, 1, 0.3, 1) 0.2s both;
}

.unit {
  padding: 12px 4px;
  position: relative;
}

.unit + .unit::before {
  content: '';
  position: absolute;
  left: 0;
  top: 18%;
  bottom: 18%;
  width: 1px;
  background: linear-gradient(180deg, transparent, rgba(255, 45, 120, 0.6), rgba(34, 211, 238, 0.6), transparent);
  box-shadow: 0 0 6px rgba(255, 45, 120, 0.4);
}

.unit-value {
  font-size: 26px;
  font-weight: 800;
  letter-spacing: -1px;
  line-height: 1;
  font-variant-numeric: tabular-nums;
}

.unit-label {
  margin-top: 8px;
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: rgba(255, 255, 255, 0.75);
  text-shadow: 0 2px 6px rgba(0, 0, 0, 0.95);
}

.unit:nth-child(1) .unit-value {
  color: #ff2d78;
  text-shadow:
    0 2px 4px rgba(0, 0, 0, 0.95),
    0 0 20px rgba(255, 45, 120, 0.95),
    0 0 40px rgba(255, 45, 120, 0.55);
}
.unit:nth-child(2) .unit-value {
  color: #ffd166;
  text-shadow:
    0 2px 4px rgba(0, 0, 0, 0.95),
    0 0 20px rgba(255, 209, 102, 0.95),
    0 0 40px rgba(255, 209, 102, 0.55);
}
.unit:nth-child(3) .unit-value {
  color: #22d3ee;
  text-shadow:
    0 2px 4px rgba(0, 0, 0, 0.95),
    0 0 20px rgba(34, 211, 238, 0.95),
    0 0 40px rgba(34, 211, 238, 0.55);
}

/* ============================================================
   PROGRESS
   ============================================================ */
.progress {
  animation: rise 1s cubic-bezier(0.16, 1, 0.3, 1) 0.3s both;
}

.progress-header {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: 12px;
  padding: 0 2px;
}

.progress-label {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: rgba(255, 255, 255, 0.75);
  text-shadow: 0 2px 6px rgba(0, 0, 0, 0.95);
}

.progress-value {
  font-size: 13px;
  font-weight: 800;
  letter-spacing: 0.3px;
  font-variant-numeric: tabular-nums;
  color: #22d3ee;
  text-shadow:
    0 2px 4px rgba(0, 0, 0, 0.95),
    0 0 16px rgba(34, 211, 238, 0.95);
}

.progress-track {
  height: 4px;
  border-radius: 100px;
  background: rgba(0, 0, 0, 0.55);
  overflow: hidden;
  position: relative;
  box-shadow:
    0 1px 2px rgba(0, 0, 0, 0.65) inset,
    0 0 0 1px rgba(255, 255, 255, 0.06) inset;
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
}

.progress-fill {
  height: 100%;
  width: 0%;
  border-radius: 100px;
  background: linear-gradient(90deg, #ff2d78 0%, #ffd166 50%, #22d3ee 100%);
  box-shadow:
    0 0 12px rgba(255, 45, 120, 0.95),
    0 0 20px rgba(34, 211, 238, 0.75);
  transition: width 0.9s cubic-bezier(0.16, 1, 0.3, 1);
}

/* ============================================================
   ZERO-DAY STATE
   ============================================================ */
.zero {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
  text-align: center;
  animation: rise 0.9s cubic-bezier(0.16, 1, 0.3, 1) both;
}

.zero-cell {
  padding: 12px 4px;
  position: relative;
}

.zero-cell + .zero-cell::before {
  content: '';
  position: absolute;
  left: 0;
  top: 18%;
  bottom: 18%;
  width: 1px;
  background: linear-gradient(180deg, transparent, rgba(255, 45, 120, 0.6), rgba(34, 211, 238, 0.6), transparent);
  box-shadow: 0 0 6px rgba(255, 45, 120, 0.4);
}

.zero-value {
  font-size: 44px;
  font-weight: 900;
  letter-spacing: -2px;
  line-height: 1;
  font-variant-numeric: tabular-nums;
}

.zero-label {
  margin-top: 10px;
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: rgba(255, 255, 255, 0.75);
  text-shadow: 0 2px 6px rgba(0, 0, 0, 0.95);
}

.zero-cell:nth-child(1) .zero-value {
  color: #ff2d78;
  text-shadow:
    0 2px 4px rgba(0, 0, 0, 0.95),
    0 0 28px rgba(255, 45, 120, 0.95),
    0 0 50px rgba(255, 45, 120, 0.6);
}
.zero-cell:nth-child(2) .zero-value {
  color: #ffd166;
  text-shadow:
    0 2px 4px rgba(0, 0, 0, 0.95),
    0 0 28px rgba(255, 209, 102, 0.95),
    0 0 50px rgba(255, 209, 102, 0.6);
}
.zero-cell:nth-child(3) .zero-value {
  color: #22d3ee;
  text-shadow:
    0 2px 4px rgba(0, 0, 0, 0.95),
    0 0 28px rgba(34, 211, 238, 0.95),
    0 0 50px rgba(34, 211, 238, 0.6);
}

/* ============================================================
   FOOTER
   ============================================================ */
.footer {
  text-align: center;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: rgba(255, 255, 255, 0.6);
  animation: rise 1s cubic-bezier(0.16, 1, 0.3, 1) 0.4s both;
  text-shadow: 0 2px 8px rgba(0, 0, 0, 0.95);
}

.footer .from {
  color: rgba(255, 45, 120, 0.95);
  text-shadow: 0 2px 6px rgba(0, 0, 0, 0.95), 0 0 10px rgba(255, 45, 120, 0.65);
}
.footer .to {
  color: rgba(34, 211, 238, 0.95);
  text-shadow: 0 2px 6px rgba(0, 0, 0, 0.95), 0 0 10px rgba(34, 211, 238, 0.65);
}

.footer .arrow {
  display: inline-block;
  margin: 0 12px;
  color: rgba(255, 209, 102, 0.85);
}

/* ============================================================
   END SCREEN
   ============================================================ */
.end {
  position: fixed;
  inset: 0;
  z-index: 999;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  padding: 40px;
  background: linear-gradient(180deg, rgba(10, 0, 24, 0.85) 0%, rgba(45, 10, 78, 0.92) 100%);
  backdrop-filter: blur(50px) saturate(180%);
  -webkit-backdrop-filter: blur(50px) saturate(180%);
  animation: fadeIn 0.9s ease both;
}

.end-title {
  font-size: 62px;
  font-weight: 900;
  letter-spacing: -3px;
  line-height: 0.9;
  background: linear-gradient(180deg, #ffffff 0%, #ffd166 40%, #ff2d78 100%);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  color: transparent;
  filter:
    drop-shadow(0 8px 40px rgba(255, 45, 120, 0.85))
    drop-shadow(0 0 80px rgba(255, 140, 66, 0.55));
  margin-bottom: 16px;
}

.end-sub {
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 6px;
  text-transform: uppercase;
  color: #22d3ee;
  text-shadow: 0 0 20px rgba(34, 211, 238, 0.9), 0 0 40px rgba(34, 211, 238, 0.5);
  margin-bottom: 48px;
}

.end-credit {
  font-size: 12px;
  font-weight: 500;
  letter-spacing: 0.5px;
  color: rgba(255, 255, 255, 0.6);
  margin-bottom: 32px;
}

.end-credit a {
  color: #ff2d78;
  text-decoration: none;
  font-weight: 700;
  border-bottom: 1px solid rgba(255, 45, 120, 0.5);
  padding-bottom: 2px;
  transition: 0.2s;
  text-shadow: 0 0 12px rgba(255, 45, 120, 0.65);
}

.reload {
  background: linear-gradient(135deg, #ff2d78, #a855f7);
  border: 1px solid rgba(255, 255, 255, 0.15);
  color: #ffffff;
  font-family: inherit;
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 2px;
  text-transform: uppercase;
  padding: 14px 44px;
  border-radius: 100px;
  cursor: pointer;
  transition: transform 0.2s ease, box-shadow 0.2s ease;
  box-shadow:
    0 10px 30px rgba(255, 45, 120, 0.55),
    0 0 40px rgba(168, 85, 247, 0.45);
}

.reload:active {
  transform: scale(0.95);
  box-shadow: 0 5px 15px rgba(255, 45, 120, 0.45);
}

/* ============================================================
   ANIMATIONS
   ============================================================ */
@keyframes rise {
  from { opacity: 0; transform: translateY(24px); }
  to   { opacity: 1; transform: translateY(0); }
}

@keyframes fadeIn {
  from { opacity: 0; }
  to   { opacity: 1; }
}

.hidden { display: none !important; }

/* ============================================================
   RESPONSIVE
   ============================================================ */
@media (max-height: 700px) {
  .stack { gap: 16px; padding: 12px 0; }
  .middle { gap: 20px; }
  .days-value { font-size: clamp(80px, 24vw, 112px); }
  .title { font-size: 52px; }
  .zero-value { font-size: 36px; }
}

@media (max-width: 380px) {
  .app { padding-left: 22px; padding-right: 22px; }
  .title { font-size: 52px; }
  .days-value { font-size: clamp(84px, 26vw, 120px); }
  .unit-value { font-size: 22px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}
</style>
</head>
<body>

<!-- ============================================================
     BACKGROUND
     ============================================================ -->
<div class="bg">
  <div class="grid"></div>
  <div class="scanlines"></div>
  <div class="vignette"></div>
</div>

<!-- ============================================================
     APP
     ============================================================ -->
<div class="app" id="app">
  <div class="stack">

    <!-- HEADER -->
    <div class="header" id="header">
      <div class="brand">Grand Theft Auto</div>
      <div class="title">VI</div>
      <div class="subtitle">Vice City</div>
    </div>

    <!-- MIDDLE -->
    <div class="middle">

      <!-- Days -->
      <div class="days" id="daysBlock">
        <div class="days-value" id="daysValue">0</div>
        <div class="days-label">Days Remaining</div>
      </div>

      <!-- Zero-day -->
      <div class="zero hidden" id="zeroBlock">
        <div class="zero-cell">
          <div class="zero-value" id="hoursZero">0</div>
          <div class="zero-label">Hours</div>
        </div>
        <div class="zero-cell">
          <div class="zero-value" id="minutesZero">00</div>
          <div class="zero-label">Minutes</div>
        </div>
        <div class="zero-cell">
          <div class="zero-value" id="secondsZero">00</div>
          <div class="zero-label">Seconds</div>
        </div>
      </div>

      <!-- Units -->
      <div class="units" id="unitsRow">
        <div class="unit">
          <div class="unit-value" id="hoursValue">0</div>
          <div class="unit-label">Hours</div>
        </div>
        <div class="unit">
          <div class="unit-value" id="minutesValue">00</div>
          <div class="unit-label">Minutes</div>
        </div>
        <div class="unit">
          <div class="unit-value" id="secondsValue">00</div>
          <div class="unit-label">Seconds</div>
        </div>
      </div>

      <!-- Progress -->
      <div class="progress" id="progressBlock">
        <div class="progress-header">
          <div class="progress-label">Progress</div>
          <div class="progress-value" id="percentText">0.00%</div>
        </div>
        <div class="progress-track">
          <div class="progress-fill" id="progressFill"></div>
        </div>
      </div>

    </div>

    <!-- FOOTER -->
    <div class="footer" id="footer">
      <span class="from">Dec 4, 2023</span>
      <span class="arrow">—</span>
      <span class="to">Nov 19, 2026</span>
    </div>

  </div>
</div>

<!-- ============================================================
     END SCREEN
     ============================================================ -->
<div class="end hidden" id="endScreen">
  <div class="end-title">Welcome</div>
  <div class="end-sub">to Vice City</div>
  <div class="end-credit">
    Countdown crafted by
    <a href="https://t.me/GameBadNews" target="_blank" rel="noopener noreferrer">GameBadNews</a>
  </div>
  <button class="reload" id="reloadBtn">Reload</button>
</div>

<script>
(function () {
  'use strict';

  const makeDate = (y, m, d) => new Date(y, m, d, 0, 0, 0);

  const START = makeDate(2023, 11, 4);
  const END   = makeDate(2026, 10, 19);
  const TOTAL = END - START;

  const $ = (id) => document.getElementById(id);

  const el = {
    header:       $('header'),
    daysBlock:    $('daysBlock'),
    zeroBlock:    $('zeroBlock'),
    unitsRow:     $('unitsRow'),
    progressBlk:  $('progressBlock'),
    footer:       $('footer'),
    daysValue:    $('daysValue'),
    hoursValue:   $('hoursValue'),
    minutesValue: $('minutesValue'),
    secondsValue: $('secondsValue'),
    hoursZero:    $('hoursZero'),
    minutesZero:  $('minutesZero'),
    secondsZero:  $('secondsZero'),
    progressFill: $('progressFill'),
    percentText:  $('percentText'),
    endScreen:    $('endScreen'),
    app:          $('app')
  };

  let timerId = null;
  let finished = false;

  const pad = (n) => String(n).padStart(2, '0');

  function breakdown(totalSec) {
    totalSec = Math.max(0, Math.floor(totalSec));
    return {
      days:    Math.floor(totalSec / 86400),
      hours:   Math.floor(totalSec / 3600),
      minutes: Math.floor((totalSec % 3600) / 60),
      seconds: totalSec % 60
    };
  }

  function progressPct(now) {
    if (now <= START) return 0;
    if (now >= END)   return 100;
    return ((now - START) / TOTAL) * 100;
  }

  function render() {
    if (finished) return;

    const now = new Date();

    if (now >= END) {
      finished = true;
      if (timerId) clearInterval(timerId);
      el.app.style.display = 'none';
      el.endScreen.classList.remove('hidden');
      return;
    }

    const sec = (END - now) / 1000;
    const { days, hours, minutes, seconds } = breakdown(sec);
    const pct = progressPct(now);

    el.progressFill.style.width = pct + '%';
    el.percentText.textContent  = pct.toFixed(2) + '%';

    if (days > 0) {
      el.daysBlock.classList.remove('hidden');
      el.zeroBlock.classList.add('hidden');
      el.unitsRow.classList.remove('hidden');
      el.progressBlk.classList.remove('hidden');
      el.header.classList.remove('hidden');
      el.footer.classList.remove('hidden');

      el.daysValue.textContent    = days.toLocaleString();
      el.hoursValue.textContent   = hours.toLocaleString();
      el.minutesValue.textContent = pad(minutes);
      el.secondsValue.textContent = pad(seconds);
    } else {
      el.daysBlock.classList.add('hidden');
      el.zeroBlock.classList.remove('hidden');
      el.unitsRow.classList.add('hidden');
      el.progressBlk.classList.add('hidden');
      el.header.classList.add('hidden');
      el.footer.classList.add('hidden');

      el.hoursZero.textContent   = hours.toLocaleString();
      el.minutesZero.textContent = pad(minutes);
      el.secondsZero.textContent = pad(seconds);
    }
  }

  $('reloadBtn').addEventListener('click', () => window.location.reload());
  document.addEventListener('dblclick', (e) => e.preventDefault(), { passive: false });

  function start() {
    render();
    timerId = setInterval(render, 1000);
  }

  window.addEventListener('load', start);
})();
</script>

</body>
</html>
